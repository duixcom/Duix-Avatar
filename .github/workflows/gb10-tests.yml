name: GB10 port checks

on:
  pull_request:
    paths:
      - 'deploy/gb10/**'
      - 'src/main/**'
      - 'src/renderer/src/views/video-edit/edit/EditUpload.vue'
      - 'tests/**'
      - 'package*.json'
      - 'electron-builder*.yml'
      - '.github/workflows/gb10-tests.yml'
  push:
    paths:
      - 'deploy/gb10/**'
      - 'src/main/**'
      - 'src/renderer/src/views/video-edit/edit/EditUpload.vue'
      - 'tests/**'
      - 'package*.json'
      - 'electron-builder*.yml'
      - '.github/workflows/gb10-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm test

  client-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

  backend-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deploy/gb10/requirements-test.txt
      - run: python -m pip install -r deploy/gb10/requirements-test.txt
      - name: Compile portable source and preparation scripts
        run: python -m compileall -q deploy/gb10
      - name: Video protocol, queue, asset and bounded frame-cache tests
        env:
          PYTHONPATH: deploy/gb10/video
        run: python -m unittest discover -s deploy/gb10/video/tests -v
      - name: Speech protocol, streaming and reference URL tests
        env:
          PYTHONPATH: deploy/gb10/voice
        run: python -m unittest discover -s deploy/gb10/voice/tests -v
      - name: Validate deployment configuration
        run: docker compose -f deploy/gb10/docker-compose.yml config --quiet
